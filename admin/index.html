<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prajaya Foundation | Admin Panel</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Prajaya Minimal Palette */
            --color-bg: #f8f8fa; /* Soft grey for the overall app background */
            --color-surface: #ffffff; /* Crisp white for cards/sidebar */
            --color-text: #4a4a59;
            --color-text-light: #8a8a9b;
            --color-heading: #171D35; /* Deep navy */
            --color-accent: #d4a65a; /* Warm gold */
            --color-primary: #0a0f21; 
            --color-border: #e9e9ee;
            --color-success: #10b981;
            --color-danger: #ef4444;
            
            --font-main: 'Inter', sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--color-heading);
            font-weight: 500;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--color-surface);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 40px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-circle {
            width: 42px;
            height: 42px;
            background: var(--color-heading);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--color-accent);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .sidebar-header h2 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.3;
            color: var(--color-heading);
        }

        .nav-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 20px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            color: var(--color-text);
            text-decoration: none;
            border-radius: 8px;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--color-bg);
            color: var(--color-heading);
        }

        .nav-link.active i {
            color: var(--color-accent);
        }

        .nav-link i {
            width: 20px;
            text-align: center;
            color: var(--color-text-light);
            transition: var(--transition);
        }
        
        .nav-link:hover i {
            color: var(--color-heading);
        }

        .logout-link {
            margin-top: auto;
            margin-bottom: 30px;
            color: var(--color-danger);
        }
        .logout-link i {
            color: var(--color-danger);
        }
        .logout-link:hover {
            background-color: rgba(239, 68, 68, 0.05);
            color: var(--color-danger);
        }
        .logout-link:hover i {
            color: var(--color-danger);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 50px 60px;
            max-width: 1400px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--color-surface);
            padding: 8px 16px 8px 8px;
            border-radius: 50px;
            border: 1px solid var(--color-border);
        }

        .admin-profile span {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--color-heading);
        }

        .admin-avatar {
            width: 36px;
            height: 36px;
            background: var(--color-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--color-surface);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--color-border);
            display: flex;
            align-items: flex-start;
            gap: 20px;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(23, 29, 53, 0.05);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--color-bg);
            color: var(--color-heading);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1px solid var(--color-border);
        }

        .stat-info h3 {
            font-size: 0.8rem;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-info p {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--color-heading);
            line-height: 1;
        }

        /* Table Section */
        .table-container {
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #d4d4d4;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .table-header {
            padding: 12px 20px;
            border-bottom: 1px solid #d4d4d4;
            background-color: #f8f8fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .refresh-btn {
            background: var(--color-heading);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .refresh-btn:hover {
            background: var(--color-accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
        }

        th, td {
            padding: 6px 12px;
            text-align: left;
            border: 1px solid #d4d4d4;
            white-space: nowrap;
        }

        th {
            background-color: #f3f2f1;
            color: #323130;
            font-weight: 600;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #c8c6c4;
            text-transform: none;
            letter-spacing: normal;
        }

        td {
            color: #323130;
            background-color: #ffffff;
        }
        
        tr:nth-child(even) td {
            background-color: #faf9f8;
        }
        
        tr:hover td {
            background-color: #e5f3ff;
            cursor: default;
        }

        td.date {
            color: #605e5c;
            font-size: 13px;
        }
        
        td.name-col {
            font-weight: 600;
            color: #323130;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: #dff6dd;
            color: #107c41;
            border: 1px solid #107c41;
        }

        .action-btn {
            background: #ffffff;
            border: 1px solid #c8c6c4;
            height: 24px;
            width: 28px;
            border-radius: 2px;
            color: #323130;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .action-btn:hover {
            background: #f3f2f1;
            border-color: #8a8886;
        }
        
        .empty-state {
            padding: 80px 50px;
            text-align: center;
            color: var(--color-text-light);
        }
        
        .empty-state i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--color-border);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 33, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--color-surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            transform: translateY(20px);
            transition: var(--transition);
        }
        
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.4rem;
            font-weight: 500;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--color-text-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-modal-btn:hover {
            color: var(--color-danger);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-light);
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.05rem;
            color: var(--color-heading);
            font-weight: 500;
            padding: 12px 16px;
            background: var(--color-bg);
            border-radius: 8px;
            border: 1px solid var(--color-border);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-circle">P</div>
            <h2>PRAJAYA<br><span style="color: var(--color-accent);">ADMIN</span></h2>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-link active">
                <i class="fas fa-layer-group"></i> Dashboard
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-users"></i> Volunteers
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-inbox"></i> Messages
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-sliders-h"></i> Settings
            </a>
            <a href="#" class="nav-link logout-link">
                <i class="fas fa-arrow-right-from-bracket"></i> Logout
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h1>Applications Dashboard</h1>
            <div class="admin-profile">
                <div class="admin-avatar"><i class="fas fa-user"></i></div>
                <span>Admin User</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="stat-info">
                    <h3>Total Applications</h3>
                    <p id="total-count">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="stat-info">
                    <h3>Approved</h3>
                    <p>0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <div class="stat-info">
                    <h3>Pending Review</h3>
                    <p>0</p>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>Recent Volunteer Applications</h2>
                <button class="refresh-btn" onclick="fetchApplications()">
                    <i class="fas fa-rotate-right"></i> Refresh Data
                </button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Applied On</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="applications-table-body">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="fas fa-circle-notch fa-spin"></i><br>
                            Loading applications...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="appModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Application Details</h2>
                <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <!-- Dynamically injected -->
            </div>
        </div>
    </div>

    <script>
        let currentApplications = [];

        // Fetch applications from the backend API
        async function fetchApplications() {
            const tableBody = document.getElementById('applications-table-body');
            const totalCount = document.getElementById('total-count');
            
            tableBody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-circle-notch fa-spin"></i><br>Refreshing data...</td></tr>';
            
            try {
                const response = await fetch('/api/v1/applications');
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    currentApplications = result.data;
                    totalCount.textContent = result.data.length;
                    
                    let html = '';
                    result.data.forEach(app => {
                        const date = new Date(app.created_at).toLocaleDateString('en-US', {
                            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'
                        });
                        
                        html += `
                            <tr>
                                <td class="name-col">${app.name}</td>
                                <td>${app.email}</td>
                                <td>${app.phone}</td>
                                <td class="date">${date}</td>
                                <td><span class="status-badge">New</span></td>
                                <td>
                                    <button class="action-btn" title="View Details" onclick="viewApplication('${app.id}')"><i class="fas fa-arrow-right"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    tableBody.innerHTML = html;
                } else {
                    currentApplications = [];
                    tableBody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-folder-open"></i><br>No applications found in the database.</td></tr>';
                    totalCount.textContent = '0';
                }
            } catch (error) {
                console.error('Error fetching applications:', error);
                tableBody.innerHTML = '<tr><td colspan="6" class="empty-state" style="color: var(--color-danger);"><i class="fas fa-triangle-exclamation"></i><br>Failed to load applications. Make sure the server endpoint exists!</td></tr>';
            }
        }

        function viewApplication(id) {
            const app = currentApplications.find(a => a.id == id); // Use loose equality in case of string/number mismatch
            if (!app) {
                console.error("Could not find application with id", id);
                return;
            }
            
            const date = new Date(app.created_at).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit'
            });
            
            const dob = app.dob ? new Date(app.dob).toLocaleDateString('en-US') : 'N/A';
            
            const resumeLink = app.resume_path 
                ? `<a href="/uploads/${app.resume_path}" target="_blank" style="color: var(--color-accent); text-decoration: underline;">View Resume <i class="fas fa-external-link-alt"></i></a>` 
                : 'Not provided';
                
            const photoLink = app.photo_path 
                ? `<a href="/uploads/${app.photo_path}" target="_blank" style="color: var(--color-accent); text-decoration: underline;">View Photo <i class="fas fa-external-link-alt"></i></a>` 
                : 'Not provided';

            const html = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="detail-group">
                        <span class="detail-label">Full Name</span>
                        <div class="detail-value">${app.name}</div>
                    </div>
                    <div class="detail-group">
                        <span class="detail-label">Category</span>
                        <div class="detail-value">${app.category || 'N/A'}</div>
                    </div>
                    
                    <div class="detail-group">
                        <span class="detail-label">Age & DOB</span>
                        <div class="detail-value">${app.age || 'N/A'} yrs (${dob})</div>
                    </div>
                    <div class="detail-group">
                        <span class="detail-label">Blood Group</span>
                        <div class="detail-value">${app.blood_group || 'N/A'}</div>
                    </div>
                    
                    <div class="detail-group">
                        <span class="detail-label">Email Address</span>
                        <div class="detail-value">${app.email}<br><small style="color: #666;">Alt: ${app.alt_email || 'None'}</small></div>
                    </div>
                    <div class="detail-group">
                        <span class="detail-label">Phone Number</span>
                        <div class="detail-value">${app.phone}<br><small style="color: #666;">Alt: ${app.alt_phone || 'None'}</small></div>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
                    <div class="detail-group">
                        <span class="detail-label">Current Status</span>
                        <div class="detail-value">${app.current_status || 'N/A'}</div>
                    </div>
                    <div class="detail-group">
                        <span class="detail-label">Education</span>
                        <div class="detail-value">${app.education || 'N/A'}</div>
                    </div>
                </div>
                
                <div class="detail-group" style="margin-top: 10px;">
                    <span class="detail-label">Temporary Address</span>
                    <div class="detail-value" style="white-space: pre-wrap;">${app.temp_address || 'N/A'}</div>
                </div>
                
                <div class="detail-group">
                    <span class="detail-label">Permanent Address</span>
                    <div class="detail-value" style="white-space: pre-wrap;">${app.perm_address || 'N/A'}</div>
                </div>
                
                <div class="detail-group">
                    <span class="detail-label">Motivation</span>
                    <div class="detail-value" style="white-space: pre-wrap;">${app.motivation || 'N/A'}</div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
                    <div class="detail-group">
                        <span class="detail-label">Passport Photo</span>
                        <div class="detail-value">${photoLink}</div>
                    </div>
                    <div class="detail-group">
                        <span class="detail-label">Resume / CV</span>
                        <div class="detail-value">${resumeLink}</div>
                    </div>
                </div>
            `;

            document.getElementById('modal-body-content').innerHTML = html;
            
            document.getElementById('appModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('appModal').classList.remove('active');
        }
        
        // Close modal on outside click
        document.getElementById('appModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Load data on start
        window.addEventListener('DOMContentLoaded', fetchApplications);
    </script>
</body>
</html>
