<!DOCTYPE html>
<html lang="en">
<head>\n    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Initiatives | Prajaya Foundation</title>
    <meta name="description" content="Stay updated with upcoming and past events by Prajaya Foundation. Join our initiatives in Chennai for health camps, education drives, and more.">
    <link rel="canonical" href="https://prajayafoundation.org/events.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prajayafoundation.org/events.html">
    <meta property="og:title" content="Events & Initiatives | Prajaya Foundation">
    <meta property="og:description" content="Stay updated with upcoming and past events by Prajaya Foundation. Join our initiatives in Chennai for health camps, education drives, and more.">
    <meta property="og:image" content="https://prajayafoundation.org/assets/images/logo.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://prajayafoundation.org/events.html">
    <meta property="twitter:title" content="Events & Initiatives | Prajaya Foundation">
    <meta property="twitter:description" content="Stay updated with upcoming and past events by Prajaya Foundation. Join our initiatives in Chennai for health camps, education drives, and more.">
    <meta property="twitter:image" content="https://prajayafoundation.org/assets/images/logo.png">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Events & Initiatives | Prajaya Foundation",
  "url": "https://prajayafoundation.org/events.html"
}
    </script>
    <!-- Open Graph -->
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --color-bg: #ffffff;
            --color-surface: #f4f3f8;
            --color-text: #403d58;
            --color-heading: #2C2946;
            --color-accent: #f2bb47;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
        }

        .header-nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-link {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-heading);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-section {
            padding: 80px 5%;
            text-align: center;
            background: var(--color-surface);
            margin-bottom: 60px;
        }

        .hero-section h1 {
            font-size: 3rem;
            color: var(--color-heading);
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            color: #666;
        }

        .events-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--color-heading);
            color: white;
            border-color: var(--color-heading);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 100px;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: var(--color-accent);
        }

        .event-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .event-content {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .event-date {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .event-title {
            font-size: 1.3rem;
            color: var(--color-heading);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .event-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
            flex: 1;
        }

        .event-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="/" class="logo-link">
            <img src="/assets/images/logo.png" alt="Prajaya Logo" style="height: 40px; border-radius: 8px;">
            Prajaya Foundation
        </a>
        <a href="/#contact" style="color: var(--color-heading); text-decoration: none; font-weight: 500;">Contact Us</a>
    </header>

    <section class="hero-section">
        <h1>Our Events</h1>
        <p>Discover how we are making an impact in our communities. Join us in our upcoming initiatives or browse through our past success stories.</p>
    </section>

    <div class="events-container">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Events</button>
            <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="events-grid" id="eventsGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading events...</div>
        </div>
    </div>

    <script>
        let allEvents = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchEvents();

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderEvents(e.target.getAttribute('data-filter'));
                });
            });
        });

        async function fetchEvents() {
            try {
                const res = await fetch('/api/v1/events');
                const result = await res.json();
                if(result.success) {
                    allEvents = result.data;
                    renderEvents('all');
                } else {
                    document.getElementById('eventsGrid').innerHTML = '<div class="loading">Failed to load events.</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('eventsGrid').innerHTML = '<div class="loading">Network error loading events.</div>';
            }
        }

        function renderEvents(filter) {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = '';

            let filtered = allEvents;
            if (filter !== 'all') {
                filtered = allEvents.filter(e => {
                    if (filter === 'upcoming') return ['upcoming', 'ongoing'].includes(e.status.toLowerCase());
                    if (filter === 'completed') return e.status.toLowerCase() === 'completed';
                    return true;
                });
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">No events found for this category.</div>';
                return;
            }

            filtered.forEach(ev => {
                const dateObj = new Date(ev.event_date);
                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                // Get cover image URL correctly resolving from Supabase (handled in backend via getPublicUrl if needed)
                // For now, event_images array is joined
                let imageUrl = '/assets/images/placeholder.jpg'; // Fallback
                if (ev.event_images && ev.event_images.length > 0) {
                    imageUrl = ev.event_images[0].image_url || imageUrl;
                }

                const card = document.createElement('a');
                card.href = `/events/${ev.slug}`;
                card.className = 'event-card';
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${ev.title}" class="event-image">
                    <div class="event-content">
                        <div class="event-date">
                            <i class="far fa-calendar"></i> ${dateStr}
                        </div>
                        <h3 class="event-title">${ev.title}</h3>
                        <p class="event-desc">${ev.short_description || ''}</p>
                        <div class="event-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${ev.location || 'Chennai'}</span>
                            <span style="color: ${ev.status.toLowerCase() === 'completed' ? '#999' : 'var(--color-accent)'}">${ev.status}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
