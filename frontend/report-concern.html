<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Concern | PRAJAYA Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-surface: #f4f3f8;
            --color-text: #403d58;
            --color-heading: #2C2946;
            --color-accent: #f2bb47;
            --font-heading: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --space-container: 1200px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--color-text); background-color: var(--color-bg); line-height: 1.8; overflow-x: hidden; }
        .container { max-width: var(--space-container); margin: 0 auto; padding: 0 6%; }
        h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--color-heading); font-weight: 500; }
        a { text-decoration: none; color: inherit; }
        .header { position: fixed; top: 0; left: 0; right: 0; padding: 15px 0; background-color: var(--color-bg); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand-logo { width: 45px; height: auto; }
        .brand-text { display: flex; flex-direction: column;
            align-items: flex-start; }
        .brand-name { font-family: var(--font-heading); font-size: 1.4rem; color: var(--color-heading); line-height: 1; }
        .brand-tagline { font-size: 0.65rem; color: var(--color-accent); letter-spacing: 3.8px; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a { color: var(--color-text); font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--color-accent); }
        .nav-volunteer-btn { background-color: var(--color-heading); color: var(--color-bg) !important; padding: 12px 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem; border-radius: 4px; }
        .page-content { padding: 150px 0 100px; min-height: 70vh; }
        .page-title { font-size: 2.5rem; margin-bottom: 40px; text-align: center; }
        .content-box { background: var(--color-surface); padding: 50px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); }
        .footer { background-color: var(--color-heading); color: #fff; padding: 80px 0 40px; }
        .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 40px; margin-top: 40px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <img src="assets/images/logo.png" alt="PRAJAYA Foundation Logo" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">PRAJAYA</span>
                    <span class="brand-tagline">Foundation</span>
                </div>
            </a>
            <nav class="nav-links">
                <a href="index.html">Back to Home</a>
            </nav>
        </div>
    </header>

    <div class="page-content">
        <div class="container">
            <h1 class="page-title">Report a Concern</h1>
            <div class="content-box">
                <p>Content for Report a Concern will be updated soon.</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <span>&copy; 2026 PRAJAYA Foundation. All Rights Reserved.</span>
                <span style="font-family: var(--font-heading); color: var(--color-accent); font-size: 1.1rem; font-weight: 600;">Deserve to Deserve</span>
            </div>
        </div>
    </footer>
</body>
</html>
