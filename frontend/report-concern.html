    <style>
        :root {
            --color-bg: #ffffff;
            --color-surface: #f4f3f8;
            --color-text: #403d58;
            --color-heading: #2C2946;
            --color-accent: #f2bb47;
            --font-heading: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --space-container: 1200px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--color-text); background-color: var(--color-bg); line-height: 1.8; overflow-x: hidden; }
        .container { max-width: var(--space-container); margin: 0 auto; padding: 0 6%; }
        h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--color-heading); font-weight: 500; }
        a { text-decoration: none; color: inherit; }
        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--color-heading);
            color: var(--color-bg);
        }
        
        .btn-primary:hover {
            background-color: var(--color-accent);
        }

        .btn-outline {
            border-color: var(--color-heading);
            color: var(--color-heading);
            background-color: transparent;
        }

        .btn-outline:hover {
            background-color: var(--color-heading);
            color: var(--color-bg);
        }

        .btn-text {
            padding: 0;
            border-bottom: 1px solid var(--color-accent);
            color: var(--color-heading);
            padding-bottom: 4px;
        }

        .btn-text:hover {
            color: var(--color-accent);
        }

        
/* --- Navigation --- */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 20px 0;
            z-index: 1000;
            transition: var(--transition);
            background-color: transparent;
            border-bottom: 1px solid transparent;
            transform: translateY(0);
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header.scrolled {
            padding: 15px 0;
            background-color: var(--color-bg);
            border-bottom-color: rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transform: translateY(0);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 100%;
            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 45px; height: auto;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .header.scrolled .brand-name {
            color: var(--color-heading);
        }

        .brand-tagline {
            font-size: 0.65rem;
            color: var(--color-accent);
            letter-spacing: 4.6px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: var(--transition);
        }

        .header.scrolled .nav-links a {
            color: var(--color-text);
        }

        .nav-links a:hover, .header.scrolled .nav-links a:hover {
            color: var(--color-accent);
        }

        .nav-links a.btn-primary:hover, .header.scrolled .nav-links a.btn-primary:hover {
            color: var(--color-bg);
        }
        
        .mobile-menu-btn {
            display: none;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .header.scrolled .mobile-menu-btn {
            color: var(--color-heading);
        }

        
        .page-content { padding: 150px 0 100px; min-height: 70vh; }
        .page-title { font-size: 2.5rem; margin-bottom: 40px; text-align: center; }
        .content-box { background: var(--color-surface); padding: 50px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); }
        .footer { background-color: var(--color-heading); color: #fff; padding: 80px 0 40px; }
        .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 40px; margin-top: 40px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
    
</style>

<body>
        <header class="header scrolled" id="header">

            </div>

    <div class="page-content">

                    <a href="/privacy-policy" style="text-decoration: underline; color: rgba(255,255,255,0.7);">Privacy Policy</a>
                </div>
                <div class="footer-bottom-right">
                    <span style="font-family: var(--font-heading); color: var(--color-accent); font-size: 1.1rem; font-weight: 600;">Deserve to Deserve</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Mobile Menu
        const mobileBtn = document.getElementById('mobile-btn');
        const navLinks = document.getElementById('nav-links');
        const navItems = document.querySelectorAll('.nav-links a');

        if (mobileBtn && navLinks) {
            mobileBtn.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = mobileBtn.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.classList.replace('fa-bars', 'fa-times');
                } else {
                    icon.classList.replace('fa-times', 'fa-bars');
                }
            });

            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    if (mobileBtn.querySelector('i')) {
                        mobileBtn.querySelector('i').classList.replace('fa-times', 'fa-bars');
                    }
                });
            });
        }
    </script>
